<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 770" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1740" height="770" fill="#ffffff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5b6b7a"/></marker></defs>
<path d="M260,180 L590,180 L590,290" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="590" y="174" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Управляет доступом,</tspan></text>
<text x="590" y="187" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">открывает дверь и</tspan></text>
<text x="590" y="200" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">шлагбаум,</tspan></text>
<text x="590" y="213" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">смотрит видео и события</tspan></text>
<text x="590" y="226" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">[Мобильное приложение]</tspan></text>
<path d="M750,375 L855,375 L855,330 L1110,330 L1110,375" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="855" y="324" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Списки доступа, команды</tspan></text>
<text x="855" y="337" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">открытия</tspan></text>
<text x="855" y="350" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">[HTTPS, API]</tspan></text>
<path d="M960,375 L855,375 L855,420 L590,420 L590,375" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="855" y="414" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">События: звонки,</tspan></text>
<text x="855" y="427" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">распознавание</tspan></text>
<text x="855" y="440" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">[Webhook]</tspan></text>
<path d="M1260,375 L1340,375 L1340,220 L1550,220 L1550,220" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1340" y="214" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Управление, видеопоток</tspan></text>
<path d="M1260,375 L1340,375 L1340,530 L1550,530 L1550,530" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1340" y="524" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Управление</tspan></text>
<path d="M260,620 L380,620 L380,60 L1340,60 L1550,60 L1550,90" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="860" y="54" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Звонок, распознавание лица</tspan></text>
<path d="M260,620 L1330,620 L1330,610 L1550,610 L1550,595" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1330" y="604" font-size="11" fill="#33475b" text-anchor="middle"><tspan style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Распознавание автономера</tspan></text>
<circle cx="160" cy="112" r="22" fill="#083F75" stroke="#06315C" stroke-width="1.5"/>
<rect x="84" y="124" width="152" height="144" rx="14" fill="#083F75" stroke="#06315C" stroke-width="1.5"/>
<text x="160" y="176" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Собственник</text>
<text x="160" y="190" font-size="10" font-weight="normal" fill="#ffffff" text-anchor="middle">[Person]</text>
<text x="160" y="202" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">Жилец, владеет квартирой;</text>
<text x="160" y="214" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">управляет «Умным домом» через</text>
<text x="160" y="226" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">мобильное приложение</text>
<circle cx="160" cy="552" r="22" fill="#083F75" stroke="#06315C" stroke-width="1.5"/>
<rect x="84" y="564" width="152" height="144" rx="14" fill="#083F75" stroke="#06315C" stroke-width="1.5"/>
<text x="160" y="616" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Гость</text>
<text x="160" y="630" font-size="10" font-weight="normal" fill="#ffffff" text-anchor="middle">[Person]</text>
<text x="160" y="642" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">Посетитель или водитель:</text>
<text x="160" y="654" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">звонит в домофон, проходит</text>
<text x="160" y="666" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">распознавание</text>
<rect x="430" y="290" width="320" height="170" rx="10" fill="#1061A0" stroke="#0B4C82" stroke-width="1.5"/>
<text x="590" y="350" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PropDevelopment</text>
<text x="590" y="364" font-size="10" font-weight="normal" fill="#ffffff" text-anchor="middle">[Software System]</text>
<text x="590" y="376" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">Мобильное приложение</text>
<text x="590" y="387" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">собственников и бэкенд.</text>
<text x="590" y="399" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">Управляет правами доступа,</text>
<text x="590" y="411" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">отображает события и видео</text>
<rect x="960" y="290" width="300" height="170" rx="10" fill="#8C8496" stroke="#736782" stroke-width="1.5"/>
<text x="1110" y="344" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Партнёрская платформа «Умный дом»</text>
<text x="1110" y="358" font-size="10" font-weight="normal" fill="#ffffff" text-anchor="middle">[Software System]</text>
<text x="1110" y="370" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">Сервисы домофона и шлагбаума:</text>
<text x="1110" y="381" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">распознавание лиц и</text>
<text x="1110" y="393" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">автономеров, хранение</text>
<text x="1110" y="405" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">биометрии, управление</text>
<text x="1110" y="416" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">устройствами</text>
<rect x="1420" y="90" width="260" height="130" rx="10" fill="#62828F" stroke="#46606B" stroke-width="1.5"/>
<text x="1550" y="136" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Интеллектуальный домофон</text>
<text x="1550" y="149" font-size="10" font-weight="normal" fill="#ffffff" text-anchor="middle">[Внешнее устройство]</text>
<text x="1550" y="161" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">Видеодомофон с распознаванием</text>
<text x="1550" y="173" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">лиц; авто-открытие двери по</text>
<text x="1550" y="185" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">разрешённому доступу</text>
<rect x="1420" y="530" width="260" height="130" rx="10" fill="#62828F" stroke="#46606B" stroke-width="1.5"/>
<text x="1550" y="576" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Интеллектуальный шлагбаум</text>
<text x="1550" y="589" font-size="10" font-weight="normal" fill="#ffffff" text-anchor="middle">[Внешнее устройство]</text>
<text x="1550" y="601" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">Шлагбаум с распознаванием</text>
<text x="1550" y="613" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">автономеров; авто-открытие при</text>
<text x="1550" y="625" font-size="9" font-weight="normal" fill="#E6E6E6" text-anchor="middle">разрешённом въезде</text>
</svg>